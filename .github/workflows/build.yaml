name: Build APK

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Sync orange-cloud android"]
    types: [completed]

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: 写入 local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "OAUTH_CLIENT_ID=${{ secrets.OAUTH_CLIENT_ID }}" >> local.properties

      - name: 替换回调地址为自己的中转
        env:
          REDIRECT: ${{ secrets.OAUTH_REDIRECT_URI }}
        run: |
          grep -rlE "https://(o-c\.do|orange-cloud\.chatiro\.app)/oauth/callback" app/src \
            | xargs -r sed -i -E "s#https://(o-c\.do|orange-cloud\.chatiro\.app)/oauth/callback#${REDIRECT}#g"
          echo "--- 代码中与回调相关的位置 ---"
          grep -rnE "oauth/callback|o-c\.do|chatiro" app/src app/build.gradle.kts || true
          if ! grep -rqF "$REDIRECT" app/src; then
            echo "::warning::源码里没有找到你的回调地址,说明替换规则没有命中,请查看上面的输出"
          fi

      - name: 构建 oss release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleOssRelease

      - name: 对齐并签名
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          UNSIGNED=$(ls app/build/outputs/apk/oss/release/*.apk | head -n1)
          echo "待签名文件: $UNSIGNED"

          VERSION=$("$BT/aapt2" dump badging "$UNSIGNED" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n1)
          if [ -z "$VERSION" ]; then
            echo "::error::没有读取到 versionName"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APK_NAME=OrangeCloud-oss-v${VERSION}.apk" >> "$GITHUB_ENV"

          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:KS_PASS \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASS \
            --out "OrangeCloud-oss-v${VERSION}.apk" \
            "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "OrangeCloud-oss-v${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: OrangeCloud-oss-v${{ env.VERSION }}
          path: ${{ env.APK_NAME }}

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "Release $TAG 已存在,手动触发,覆盖上传"
              gh release upload "$TAG" "$APK_NAME" --clobber
            else
              echo "Release $TAG 已存在,自动构建跳过"
            fi
          else
            gh release create "$TAG" "$APK_NAME" \
              --title "Orange Cloud OSS v${VERSION}" \
              --notes "版本号:v${VERSION}

          - 构建风味:oss(自编译,功能全解锁)
          - 签名:OrangeCloud
          - 系统要求:Android 12(API 31)及以上
          - 构建时间:$(date -u '+%Y-%m-%d %H:%M UTC')"
          fi
