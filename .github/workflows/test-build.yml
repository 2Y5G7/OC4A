name: Test Build APK

# 用于测试你自己改过的仓库文件:
# - 不同步上游(不会覆盖你的修改)
# - 默认只产出 Artifact(保留 7 天);勾选 keep_forever 则发布为 Pre-release,长期保留
# - 可选 debug(快、不需要签名密钥)或 release(用 OrangeCloud 签名)
# 运行方式:Actions → Test Build APK → Run workflow,可在 "Use workflow from" 里选要测试的分支。

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 构建类型(debug 更快;release 用 OrangeCloud 签名)
        type: choice
        options:
          - debug
          - release
        default: debug
      show_diff:
        description: 在运行摘要里列出与上游的差异文件
        type: boolean
        default: true
      keep_forever:
        description: 长期保留(发布为 Pre-release,不会过期;不勾选则只生成 7 天有效的 Artifact)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM: chen2he/orange-cloud
  UPSTREAM_PATH: apps/android

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout 当前代码(不同步上游)
        uses: actions/checkout@v4

      - name: 列出与上游的差异
        if: inputs.show_diff
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            "https://github.com/${UPSTREAM}.git" /tmp/upstream
          git -C /tmp/upstream sparse-checkout set "${UPSTREAM_PATH}"
          DIFF=$(diff -rq --exclude=.git --exclude=.github "/tmp/upstream/${UPSTREAM_PATH}" . || true)
          {
            echo "### 与上游 ${UPSTREAM_PATH} 的差异"
            echo
            if [ -z "$DIFF" ]; then
              echo "没有差异,与上游完全一致。"
            else
              echo '```'
              echo "$DIFF" | sed "s#/tmp/upstream/${UPSTREAM_PATH}#上游#g" | head -n 100
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: 写入 local.properties
        env:
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
        run: |
          {
            echo "sdk.dir=${ANDROID_HOME}"
            echo "OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID}"
          } > local.properties

      - name: 替换回调地址为自己的中转
        env:
          REDIRECT: ${{ secrets.OAUTH_REDIRECT_URI }}
        run: |
          if [ -z "$REDIRECT" ]; then
            echo "::error::Secret OAUTH_REDIRECT_URI 为空"; exit 1
          fi
          ESC=$(printf '%s' "$REDIRECT" | sed -e 's/[\\&#]/\\&/g')
          grep -rlE "https://(o-c\.do|orange-cloud\.chatiro\.app)/oauth/callback" app/src \
            | xargs -r sed -i -E "s#https://(o-c\.do|orange-cloud\.chatiro\.app)/oauth/callback#${ESC}#g"
          echo "--- 代码中与回调相关的位置 ---"
          grep -rnE "oauth/callback|o-c\.do|chatiro" app/src app/build.gradle.kts || true
          if ! grep -rqF "$REDIRECT" app/src; then
            echo "::error::源码里没有找到你的回调地址,替换规则没有命中,构建中止"
            exit 1
          fi

      - name: 构建
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          chmod +x gradlew
          if [ "$VARIANT" = "release" ]; then
            ./gradlew :app:assembleOssRelease --stacktrace
          else
            ./gradlew :app:assembleOssDebug --stacktrace
          fi

      - name: 整理并(按需)签名 APK
        env:
          VARIANT: ${{ inputs.variant }}
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"

          if [ "$VARIANT" = "release" ]; then
            if [ -z "$KS_B64" ]; then
              echo "::error::release 构建需要 Secret KEYSTORE_BASE64"; exit 1
            fi
            SRC=$(ls app/build/outputs/apk/oss/release/*.apk | head -n1)
          else
            SRC=$(ls app/build/outputs/apk/oss/debug/*.apk | head -n1)
          fi
          echo "构建产物: $SRC"

          VERSION=$("$BT/aapt2" dump badging "$SRC" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n1)
          [ -z "$VERSION" ] && VERSION="unknown"
          OUT="OrangeCloud-oss-test-${VARIANT}-v${VERSION}-${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}.apk"

          if [ "$VARIANT" = "release" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            "$BT/zipalign" -p -f 4 "$SRC" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign \
              --ks "$RUNNER_TEMP/release.jks" \
              --ks-pass env:KS_PASS \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass env:KEY_PASS \
              --out "$OUT" \
              "$RUNNER_TEMP/aligned.apk"
          else
            cp "$SRC" "$OUT"
          fi
          "$BT/apksigner" verify --print-certs "$OUT"

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APK_NAME=$OUT" >> "$GITHUB_ENV"

      - name: 清理签名文件
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/aligned.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
          retention-days: 7

      - name: 发布为 Pre-release(长期保留)
        if: inputs.keep_forever
        env:
          GH_TOKEN: ${{ github.token }}
          VARIANT: ${{ inputs.variant }}
        run: |
          TAG="test-${VARIANT}-v${VERSION}-${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          {
            echo "测试构建(非正式版)"
            echo
            echo "- 类型:${VARIANT}"
            echo "- 版本:v${VERSION}"
            echo "- 分支 / 提交:${GITHUB_REF_NAME} / ${GITHUB_SHA}"
            echo "- 构建时间:$(date -u '+%Y-%m-%d %H:%M UTC')"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" "$APK_NAME" \
            --target "$GITHUB_SHA" \
            --prerelease --latest=false \
            --title "Test ${VARIANT} v${VERSION} (${GITHUB_SHA::7})" \
            --notes-file "$RUNNER_TEMP/notes.md"

      - name: 写入运行摘要
        env:
          VARIANT: ${{ inputs.variant }}
          KEEP: ${{ inputs.keep_forever }}
        run: |
          {
            echo "### 测试构建完成"
            echo
            echo "- 类型:${VARIANT}"
            echo "- 版本:v${VERSION}"
            echo "- 分支 / 提交:${GITHUB_REF_NAME} / \`${GITHUB_SHA::7}\`"
            echo "- 文件:${APK_NAME}(在本页底部 Artifacts 下载,保留 7 天)"
            if [ "$KEEP" = "true" ]; then
              echo "- 长期保留:仓库 Releases 页面的 Pre-release \`${RELEASE_TAG}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
